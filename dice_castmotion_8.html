<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 주사위 게임</title>
<style>
body {
  margin: 0;
  padding: 0;
  background-color: #35654D;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  box-sizing: border-box;
  padding: 20px;
}
.control-panel {
  margin-bottom: 15px;
  color: #f1f5f9;
  text-align: center;
  z-index: 20;
  font-size: 16px;
}
.control-panel select {
  background: #053d05;
  color: #fbbf24;
  border: 1.5px solid #4A2E1B;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  font-size: 15px;
}
.game-container {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 5;
  width: 100%;
  max-width: 360px;
}
.arena {
  position: relative;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle, #5C4033 30%, #3D2314 100%);
  border: 14px solid #773F1A;
  border-radius: 50%;
  box-shadow: inset 0 12px 24px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: none;
  box-sizing: border-box;
}
.power-container {
  width: 300px;
  height: 10px;
  background: #053d05;
  border: 1.5px solid #334155;
  border-radius: 5px;
  margin-top: 20px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
.power-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #10b981, #facc15, #ef4444);
  transition: none;
}
:root {
  --dice-size: 44px;
  --dice-radius: 22px;
  --dice-translate: 22px;
  --dice-shadow-z: -35px;
}
.dice-wrapper {
  position: absolute;
  width: var(--dice-size);
  height: var(--dice-size);
  left: calc(50% - var(--dice-radius));
  top: calc(50% - var(--dice-radius));
  pointer-events: none;
  visibility: hidden;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  will-change: transform;
  z-index: 10;
}
.dice-wrapper::after {
  content: '';
  position: absolute;
  width: var(--dice-size);
  height: var(--dice-size);
  background: rgba(0, 0, 0, 0);
  border-radius: 9px;
  bottom: 0;
  left: 0;
  filter: blur(4px);
  transform: translateZ(var(--dice-shadow-z));
  display: block;
  opacity: 0;
  transition: opacity 0.2s ease-out;
}
.dice-wrapper.show-result-shadow::after {
  background: rgba(0, 0, 0, 0.65);
  bottom: -4px;
  left: 4px;
  filter: blur(3px);
  transform: translateZ(var(--dice-shadow-z)) rotateX(10deg) rotateY(10deg);
  opacity: 1;
}
.cube {
  position: absolute;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
  will-change: transform;
}
.cube-face {
  position: absolute;
  width: var(--dice-size);
  height: var(--dice-size);
  padding: 0;
  box-sizing: border-box;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}
.face-inner {
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #242424 0%, #0f0f0f 100%);
  border: 1.5px solid rgba(212, 175, 55, 0.45);
  border-color: rgba(255,255,255,0.15) rgba(0,0,0,0.4) rgba(0,0,0,0.6) rgba(255,255,255,0.05);
  box-sizing: border-box;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.95), inset 2px 2px 4px rgba(255, 255, 255, 0.08);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
  -webkit-transform: translateZ(0);
}
.face-front { transform: rotateY( 0deg) translateZ(var(--dice-translate)); -webkit-transform: rotateY( 0deg) translateZ(var(--dice-translate)); }
.face-back { transform: rotateY(180deg) translateZ(var(--dice-translate)); -webkit-transform: rotateY(180deg) translateZ(var(--dice-translate)); }
.face-left { transform: rotateY(-90deg) translateZ(var(--dice-translate)); -webkit-transform: rotateY(-90deg) translateZ(var(--dice-translate)); }
.face-right { transform: rotateY( 90deg) translateZ(var(--dice-translate)); -webkit-transform: rotateY( 90deg) translateZ(var(--dice-translate)); }
.face-top { transform: rotateX( 90deg) translateZ(var(--dice-translate)); -webkit-transform: rotateX( 90deg) translateZ(var(--dice-translate)); }
.face-bottom { transform: rotateX(-90deg) translateZ(var(--dice-translate)); -webkit-transform: rotateX(-90deg) translateZ(var(--dice-translate)); }

.dot {
  display: block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, #fef08a 0%, #f59e0b 100%);
  box-shadow: 0 0 4px rgba(245, 158, 11, 0.6);
}
.grid-container {
  display: grid;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 6px;
  align-items: center;
  justify-items: center;
}
.grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.grid-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: 100%; }
.grid-2 .dot:nth-child(1) { justify-self: start; align-self: start; }
.grid-2 .dot:nth-child(2) { justify-self: end; align-self: end; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.grid-3 .dot:nth-child(1) { grid-area: 1 / 1; }
.grid-3 .dot:nth-child(2) { grid-area: 2 / 2; }
.grid-3 .dot:nth-child(3) { grid-area: 3 / 3; }
.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; }
.grid-5 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
.grid-5 .dot:nth-child(1) { grid-area: 1 / 1; }
.grid-5 .dot:nth-child(2) { grid-area: 1 / 3; }
.grid-5 .dot:nth-child(3) { grid-area: 2 / 2; }
.grid-5 .dot:nth-child(4) { grid-area: 3 / 1; }
.grid-5 .dot:nth-child(5) { grid-area: 3 / 3; }
.grid-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 4px 14px; width: 100% !important; height: 100% !important; padding: 6px 7px; }

.btn-throw {
  margin-top: 25px;
  padding: 16px 36px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.5px;
  color: #121212;
  background-color: #fbbf24;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
  transition: background-color 0.2s;
  z-index: 30;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
.btn-throw:hover { background-color: #f59e0b; }
.btn-throw:disabled { background-color: #64748b !important; color: #94a3b8; cursor: not-allowed; box-shadow: none; opacity: 0.6; }

/* 📱 모바일 UI 크기를 약 10% 더 키운 반응형 스타일 적용 */
@media (max-width: 400px) {
  :root {
    --dice-size: 40px;          /* 36px -> 40px로 확대 */
    --dice-radius: 20px;        /* 18px -> 20px로 확대 */
    --dice-translate: 20px;     /* 18px -> 20px로 확대 */
    --dice-shadow-z: -31px;     /* -28px -> -31px로 확대 */
  }
  .arena {
    width: 320px;               /* 290px -> 320px로 확대 */
    height: 320px;              /* 290px -> 320px로 확대 */
    border-width: 11px;
  }
  .power-container {
    width: 265px;               /* 240px -> 265px로 확대 */
  }
  .dot {
    width: 5.5px;               /* 5px -> 5.5px로 확대 */
    height: 5.5px;
  }
  .grid-container { padding: 4.5px; }
  .grid-4 { gap: 5.5px; }
  .grid-6 { gap: 3.5px 11px; padding: 5.5px 6.5px; }
  .btn-throw {
    padding: 15px 31px;         /* 버튼 두께 및 너비 확대 */
    font-size: 16px;            /* 15px -> 16px로 확대 */
    margin-top: 18px;
  }
}
</style>
</head>
<body>
<div class="control-panel">
  <label for="dice-count-select">🎲 주사위 개수 : </label>
  <select id="dice-count-select">
    <option value="1" selected>1개</option>
    <option value="2">2개</option>
    <option value="3">3개</option>
    <option value="4">4개</option>
    <option value="5">5개</option>
  </select>
</div>
<div class="game-container">
  <div class="arena" id="arena"></div>
  <div class="power-container">
    <div class="power-bar" id="power-bar"></div>
  </div>
</div>
<button class="btn-throw" id="throw-btn" onmousedown="startCharging()" onmouseup="stopCharging()" ontouchstart="startCharging()" ontouchend="touchendStopCharging(event)">
  🔥 주사위 던지기
</button>
<script>
const diceRotations = {
  1: { x: 0, y: 0, z: 0 },
  2: { x: 0, y: 180, z: 0 },
  3: { x: 0, y: 90, z: 0 },
  4: { x: 0, y: -90, z: 0 },
  5: { x: -90, y: 0, z: 0 },
  6: { x: 90, y: 0, z: 0 }
};
let currentDiceList = [];
let placedDicePositions = [];
let chargeInterval = null;
let powerLevel = 0, chargingUp = true;
let throwTimers = [];
let isThrowing = false;
let animationFrameId = null;

function touchendStopCharging(e) {
  if(e) e.preventDefault();
  stopCharging();
}

function startCharging() {
  if (isThrowing || chargeInterval) return;
  powerLevel = 0;
  chargingUp = true;
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }
  throwTimers.forEach(t => clearTimeout(t));
  throwTimers = [];
  currentDiceList = [];
  placedDicePositions = [];
  document.querySelectorAll('.dice-wrapper').forEach(diceNode => diceNode.remove());
  const powerBar = document.getElementById('power-bar');
  chargeInterval = setInterval(() => {
    if (chargingUp) {
      powerLevel += 4;
      if(powerLevel >= 100) chargingUp = false;
    } else {
      powerLevel -= 4;
      if(powerLevel <= 0) chargingUp = true;
    }
    powerBar.style.width = powerLevel + '%';
  }, 20);
}

function stopCharging() {
  if (!chargeInterval) return;
  clearInterval(chargeInterval);
  chargeInterval = null;
  isThrowing = true;
  document.getElementById('throw-btn').disabled = true;
  const finalPower = powerLevel;
  document.getElementById('power-bar').style.width = '0%';
  const diceToThrow = parseInt(document.getElementById('dice-count-select').value);
  for (let i = 0; i < diceToThrow; i++) {
    const t = setTimeout(() => {
      executeSingleThrow(finalPower);
    }, i * 110);
    throwTimers.push(t);
  }
  const startTime = performance.now();
  function updatePhysics() {
    const now = performance.now();
    const progress = Math.min((now - startTime) / 1050, 1);
    const t_rolling = 1 - Math.pow(1 - progress, 2.8);
    currentDiceList.forEach(dice => {
      if (progress < 1) {
        const curX = dice.startX + (dice.endX - dice.startX) * t_rolling;
        const curY = dice.startY + (dice.endY - dice.startY) * t_rolling;
        dice.element.style.transform = `translate3d(${curX}px, ${curY}px, 0px)`;
        dice.element.style.webkitTransform = `translate3d(${curX}px, ${curY}px, 0px)`;
        const rotX = (dice.spinSpeedX * (1 - t_rolling)) + dice.finalRotX;
        const rotY = (dice.spinSpeedY * (1 - t_rolling)) + dice.finalRotY;
        const rotZ = (dice.spinSpeedZ * (1 - t_rolling)) + dice.finalRotZ;
        dice.cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
        dice.cube.style.webkitTransform = `rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg)`;
      }
    });
    if (progress < 1) {
      animationFrameId = requestAnimationFrame(updatePhysics);
    } else {
      setTimeout(() => {
        sortAndArrangeDiceLine();
      }, 500);
    }
  }
  animationFrameId = requestAnimationFrame(updatePhysics);
}

function executeSingleThrow(power) {
  const arena = document.getElementById('arena');
  const wrapper = document.createElement('div');
  wrapper.className = 'dice-wrapper';
  const cube = document.createElement('div');
  cube.className = 'cube';
  const facesData = [
    { class: 'face-front', html: '<div class="grid-container grid-1"><span class="dot"></span></div>' },
    { class: 'face-back', html: '<div class="grid-container grid-2"><span class="dot"></span><span class="dot"></span></div>' },
    { class: 'face-left', html: '<div class="grid-container grid-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>' },
    { class: 'face-right', html: '<div class="grid-container grid-4"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>' },
    { class: 'face-top', html: '<div class="grid-container grid-5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>' },
    { class: 'face-bottom', html: '<div class="grid-container grid-6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>' }
  ];
  facesData.forEach(info => {
    const face = document.createElement('div');
    face.className = `cube-face ${info.class}`;
    const inner = document.createElement('div');
    inner.className = 'face-inner';
    inner.innerHTML = info.html;
    face.appendChild(inner);
    cube.appendChild(face);
  });
  wrapper.appendChild(cube);
  arena.appendChild(wrapper);
  const resultValue = Math.floor(Math.random() * 6) + 1;
  const finalRot = diceRotations[resultValue];
  const startX = (Math.random() * 80) - 40;
  const startY = 220;
  const isMobile = window.innerWidth <= 400;
  
  const safeRadiusLimit = isMobile ? 42 : 46;
  const arenaMaxRadius = isMobile ? 125 : 145; 
  let endX = 0, endY = 0;
  const randomAngle = Math.random() * Math.PI * 2;
  
  // 🍏 최소 시작 범위는 항상 중앙 부근(10px)으로 고정
  const minRadius = 10;
  // 🍏 게이지 파워(0~100)에 비례해서 "최대 날아갈 수 있는 한계선"만 늘어납니다.
  const maxRadiusLimit = minRadius + (power * (arenaMaxRadius / 100));
  // 🍏 중앙(10px)부터 현재 파워 한계선 사이의 값을 완전한 랜덤(Math.random)으로 뽑아냅니다.
  const randomRadius = minRadius + Math.random() * (maxRadiusLimit - minRadius);
  
  const targetBaseX = Math.cos(randomAngle) * randomRadius;
  const targetBaseY = Math.sin(randomAngle) * randomRadius;

  for (let attempt = 0; attempt < 1000; attempt++) {
    const spiralRadius = (attempt * 0.2);
    const searchAngle = attempt * 0.55;
    let testX = targetBaseX + (Math.cos(searchAngle) * spiralRadius);
    let testY = targetBaseY + (Math.sin(searchAngle) * spiralRadius);
    const testRadius = Math.hypot(testX, testY);
    
    if (testRadius > arenaMaxRadius) {
      testX = (testX / testRadius) * arenaMaxRadius;
      testY = (testY / testRadius) * arenaMaxRadius;
    }
    if (!placedDicePositions.some(pos => Math.hypot(testX - pos.x, testY - pos.y) < safeRadiusLimit)) {
      endX = testX;
      endY = testY;
      break;
    }
  }
  placedDicePositions.push({ x: endX, y: endY });
  const directionSignX = Math.random() > 0.5 ? 1 : -1;
  const directionSignY = Math.random() > 0.5 ? 1 : -1;

  const powerReductionRot = (100 - power) * 7.2;

  currentDiceList.push({
    value: resultValue,
    element: wrapper,
    cube: cube,
    startX: startX,
    startY: startY,
    endX: endX,
    endY: endY,
    finalRotX: finalRot.x,
    finalRotY: finalRot.y,
    finalRotZ: finalRot.z,
    spinSpeedX: (1440 + Math.floor(Math.random() * 360) - powerReductionRot) * directionSignY,
    spinSpeedY: (1440 + Math.floor(Math.random() * 360) - powerReductionRot) * directionSignX,
    spinSpeedZ: (1080 + Math.floor(Math.random() * 360) - powerReductionRot)
  });
  wrapper.style.visibility = 'visible';
}

function sortAndArrangeDiceLine() {
  if (currentDiceList.length === 0) return;
  currentDiceList.sort((a, b) => a.value - b.value);
  const diceSpacing = window.innerWidth <= 400 ? 46 : 52;
  const startLineX = -((currentDiceList.length - 1) * diceSpacing) / 2;
  currentDiceList.forEach((dice, idx) => {
    dice.element.classList.add('show-result-shadow');
    dice.element.style.transition = 'transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
    dice.element.style.webkitTransition = '-webkit-transform 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
    const linePositionX = startLineX + (idx * diceSpacing);
    dice.element.style.transform = `translate3d(${linePositionX}px, 0px, 0px)`;
    dice.element.style.webkitTransform = `translate3d(${linePositionX}px, 0px, 0px)`;
    const targetStyle = `rotateX(${dice.finalRotX}deg) rotateY(${dice.finalRotY}deg) rotateZ(${dice.finalRotZ}deg)`;
    dice.cube.style.transform = targetStyle;
    dice.cube.style.webkitTransform = targetStyle;
  });
  setTimeout(() => {
    isThrowing = false;
    document.getElementById('throw-btn').disabled = false;
  }, 400);
}
</script>
</body>
</html>
