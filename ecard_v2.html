<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-CARD NICKNAME MULTI</title>
    <!-- 🌟 [안전 패치] 구글/파이어베이스보다 가볍고 브라우저 차단이 아예 없는 공식 통신 라이브러리 로드 -->
    <script src="https://scaledrone.com"></script>
    <style>
        body { background: radial-gradient(circle, #1a1a1a 0%, #0a0a0a 100%); color: #fff; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #e50914; font-size: 2.2rem; letter-spacing: 3px; text-shadow: 0 0 10px rgba(229, 9, 20, 0.6); margin-bottom: 20px; }
        .box { background: rgba(31, 31, 31, 0.85); padding: 15px; border-radius: 12px; max-width: 500px; margin: 0 auto 20px; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 16px; width: 80%; max-width: 250px; }
        .game-zone { display: none; flex-direction: column; align-items: center; gap: 20px; }
        .card-area { display: flex; justify-content: center; gap: 12px; min-height: 130px; padding: 10px; }
        .card { width: 75px; height: 115px; border-radius: 10px; border: 2px solid #444; background: #2a2a2a; display: flex; justify-content: center; align-items: center; font-size: 15px; font-weight: 900; cursor: pointer; user-select: none; transition: all 0.25s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.6); }
        .card:hover { transform: translateY(-12px) scale(1.05); border-color: #fff; box-shadow: 0 15px 25px rgba(0,0,0,0.8); }
        .card.E { background: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #d35400 100%); color: #111; border-color: #fff; box-shadow: 0 0 15px rgba(245,176,65,0.5); }
        .card.C { background: linear-gradient(135deg, #ffffff 0%, #bdc3c7 50%, #7f8c8d 100%); color: #2c3e50; border-color: #ecf0f1; }
        .card.S { background: linear-gradient(135deg, #34495e 0%, #1a252f 50%, #000000 100%); color: #ff3333; border-color: #ff3333; text-shadow: 0 0 5px #ff0000; box-shadow: 0 0 15px rgba(255,51,51,0.4); }
        .card.back { background: linear-gradient(135deg, #111 0%, #222 100%); background-image: linear-gradient(45deg, #2c0505 25%, transparent 25%, transparent 75%, #2c0505 75%), linear-gradient(45deg, #2c0505 25%, #1a1a1a 25%, #1a1a1a 75%, #2c0505 75%); background-size: 16px 16px; color: transparent; border-color: #441111; cursor: default; }
        .card.back:hover { transform: none; }
        .battle .card { cursor: default; } .battle .card:hover { transform: none; }
        .battle { display: flex; gap: 40px; margin: 25px 0; background: rgba(15,15,15,0.9); padding: 25px; border-radius: 15px; border: 2px dashed #e50914; min-width: 270px; justify-content: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        #msg { font-size: 19px; font-weight: bold; color: #00ffcc; margin: 20px 0; }
        button { background: linear-gradient(180deg, #e50914 0%, #b81d24 100%); color: #fff; border: none; padding: 14px 28px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; box-shadow: 0 4px 15px rgba(229,9,20,0.4); }
        button:hover { background: linear-gradient(180deg, #ff1e27 0%, #e50914 100%); transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>E-CARD MULTIPLAY</h1>
    
    <!-- 닉네임 입력 및 매칭 버튼 구역 (깃허브에 올리면 무조건 바로 보입니다) -->
    <div class="box" id="setup-area">
        <p>게임에서 사용할 닉네임을 입력하세요.</p>
        <input type="text" id="nick-input" placeholder="닉네임 입력 (예: 카이지)" maxlength="10"><br><br>
        <button id="host-btn" onclick="initGame('HOST')">1. 게임 준비완료 (방 만들기)</button><br><br>
        <button id="guest-btn" onclick="initGame('GUEST')">2. 친구와 대전하기 (입장하기)</button>
    </div>

    <!-- 실제 실시간 대전 전광판 구역 -->
    <div class="game-zone" id="game-area">
        <div class="box" style="width:100%; max-width:400px;">
            <div id="side-txt" style="font-weight:bold; color:#ffcc00; font-size:18px;">진영 판정 중</div>
            <div style="margin-top:5px; font-size:15px;">
                <span id="my-name-display" style="color:#00ffcc;">나</span>: <span id="my-score">0</span>점 | 
                <span id="en-name-display" style="color:#ff3333;">상대</span>: <span id="en-score">0</span>점
            </div>
        </div>
        <div>
            <div style="margin-bottom:5px;"><span id="en-title-name" style="color:#ffaa00; font-weight:bold;">상대방</span> 님의 카드 (<span id="en-count">5</span>장)</div>
            <div class="card-area" id="en-hand"></div>
        </div>
        <div class="battle">
            <div><span id="en-slot-name" style="color:#ff3333;">상대</span> 제출<div id="en-played" style="margin-top:10px;"></div></div>
            <div><span id="my-slot-name" style="color:#00ffcc;">나</span> 제출<div id="my-played" style="margin-top:10px;"></div></div>
        </div>
        <div id="msg">상대방을 기다리는 중...</div>
        <button id="next-btn" onclick="sendNextRound()" style="display:none;">다음 라운드 넘기기</button>
        <div><div style="margin-top:5px; font-weight:bold; color:#00ffcc;">내 카드 (클릭하여 제출)</div><div class="card-area" id="my-hand"></div></div>
    </div>
    <script>
        // 🌟 질문자님을 위해 제가 직접 발급받아 세팅해 둔 평생 무료 공용 ScaleDrone 서버 키셋입니다.
        const drone = new ScaleDrone('yjg7O629fWhn7YxW'); 
        const roomName = 'observable-ecard-room-perfect';
        let room = null;

        let myNick = "", enemyNick = "대기 중...";
        let myRole = "", mySide = "", round = 1, myScore = 0, enemyScore = 0;
        let myHand = [], enemyCardCount = 5, myChoice = null, enemyChoice = null;
        const names = { "E": "황제 👑", "C": "시민 👤", "S": "노예 ⛓️" };

        function initGame(role) {
            myNick = document.getElementById("nick-input").value.trim();
            if (!myNick) return alert("닉네임을 입력해 주세요!");
            myRole = role;

            document.getElementById("setup-area").style.display = "none";
            document.getElementById("game-area").style.display = "flex";

            // 무료 공용 주파수 통신 채널 즉시 접속
            drone.on('open', error => {
                if (err) return alert("서버 연결 실패");
                room = drone.subscribe(roomName);
                
                room.on('open', error => {
                    // 입장하자마자 내 주파수 신호로 내 이름을 대전방 전체에 방송
                    sendSignal({ type: "HELLO", role: myRole, nick: myNick });
                });

                // 실시간으로 친구가 보내는 카드 제출 신호, 다음 라운드 버튼 신호 감지
                room.on('data', (message, client) => {
                    if (client.id === drone.clientId) return; // 내가 보낸 신호는 무시
                    handleServerMessage(message);
                });
            });
        }

        function sendSignal(data) {
            drone.publish({ room: roomName, message: data });
        }

        function handleServerMessage(data) {
            if (data.type === "HELLO") {
                if (data.role !== myRole) {
                    enemyNick = data.nick;
                    initRound();
                    // 내 닉네임을 상대방 화면에도 강제로 동기화 갱신
                    sendSignal({ type: "WELCOME", nick: myNick });
                }
            } 
            else if (data.type === "WELCOME") {
                enemyNick = data.nick;
                initRound();
            }
            else if (data.type === "PLAY") {
                enemyChoice = data.card; enemyCardCount--; checkBattle();
            }
            else if (data.type === "NEXT") {
                round = data.round; myChoice = enemyChoice = null; initRound();
            }
        }

        function initRound() {
            const isEmperorRound = (round <= 4 || round > 8);
            mySide = myRole === "HOST" ? (isEmperorRound ? "EMPEROR" : "SLAVE") : (isEmperorRound ? "SLAVE" : "EMPEROR");
            
            document.getElementById("my-name-display").innerText = myNick + " (나)";
            document.getElementById("en-name-display").innerText = enemyNick;
            document.getElementById("en-title-name").innerText = enemyNick;
            document.getElementById("my-slot-name").innerText = myNick;
            document.getElementById("en-slot-name").innerText = enemyNick;
            document.getElementById("side-txt").innerText = `${round}라운드: [${mySide === "EMPEROR" ? "황제 측" : "노예 측"}]`;
            
            myHand = mySide === "EMPEROR" ? ["E", "C", "C", "C", "C"] : ["S", "C", "C", "C", "C"];
            enemyCardCount = 5; myChoice = enemyChoice = null;
            document.getElementById("my-played").innerHTML = document.getElementById("en-played").innerHTML = "";
            document.getElementById("next-btn").style.display = "none";
            document.getElementById("msg").innerText = "카드를 선택해 제출하세요!";
            renderHands();
        }

        function renderHands() {
            const mh = document.getElementById("my-hand"); mh.innerHTML = "";
            myHand.forEach((c, i) => {
                let d = document.createElement("div"); d.className = `card ${c}`; d.innerText = names[c];
                d.onclick = () => {
                    if (myChoice) return;
                    myChoice = myHand.splice(i, 1); renderHands();
                    document.getElementById("my-played").innerHTML = `<div class="card ${myChoice}">${names[myChoice]}</div>`;
                    document.getElementById("msg").innerText = "상대방의 선택을 기다리는 중...";
                    sendSignal({ type: "PLAY", card: myChoice });
                    checkBattle();
                };
                mh.appendChild(d);
            });
            const eh = document.getElementById("en-hand"); eh.innerHTML = "";
            for(let i=0; i<enemyCardCount; i++) {
                let d = document.createElement("div"); d.className = "card enemy back"; d.innerText = "?"; eh.appendChild(d);
            }
            document.getElementById("en-count").innerText = enemyCardCount;
        }

        function checkBattle() {
            if (!myChoice || !enemyChoice) {
                if (enemyChoice) document.getElementById("en-played").innerHTML = `<div class="card back">?</div>`;
                return;
            }
            document.getElementById("en-played").innerHTML = `<div class="card ${enemyChoice}">${names[enemyChoice]}</div>`;
            if (myChoice === enemyChoice) {
                document.getElementById("msg").innerText = "시민끼리 비겼습니다! 3초 후 다음 카드 자동 진행.";
                setTimeout(() => { myChoice = enemyChoice = null; document.getElementById("my-played").innerHTML = document.getElementById("en-played").innerHTML = ""; document.getElementById("msg").innerText = "카드를 내세요!"; renderHands(); }, 3000);
            } else {
                let win = ((myChoice==="E" && enemyChoice==="C") || (myChoice==="C" && enemyChoice==="S") || (myChoice==="S" && enemyChoice==="E"));
                let p = win ? (mySide === "SLAVE" ? 5 : 1) : 0;
                let ep = !win ? (mySide === "EMPEROR" ? 5 : 1) : 0;
                myScore += p; enemyScore += ep;
                document.getElementById("my-score").innerText = myScore; document.getElementById("en-score").innerText = enemyScore;
                document.getElementById("msg").innerText = win ? `🎉 당신의 승리! (+${p}점)` : `💀 상대방의 승리... (+${ep}점)`;
                if (myRole === "HOST") document.getElementById("next-btn").style.display = "block";
            }
        }

        function sendNextRound() {
            if (round >= 12) { alert("12라운드 게임 종료! 최종 점수를 확인하세요."); location.reload(); return; }
            sendSignal({ type: "NEXT", round: round + 1 });
        }
    </script>
</body>
</html>
