<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e24;
            color: #fff;
            text-align: center;
            padding: 55px 20px;
            margin: 0;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        .container {
            display: grid;
            /* 💻 데스크톱 기본: 가로 3열 배치 (9개이므로 자동 3x3 형성) */
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px;
            max-width: 900px; 
            margin: 0 auto;
        }
        .game-card {
            background-color: #2a2a35;
            border: 3px solid var(--card-color, #ffcc00);
            border-radius: 15px;
            padding: 35px 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-card:hover, .game-card:focus {
            transform: scale(1.05);
            background-color: #3b3b4a;
            box-shadow: 0 10px 25px var(--card-color);
            outline: none;
        }
        .game-icon {
            font-size: 3.2rem;
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 1.25rem;
            font-weight: bold;
        }

        /* 📱 태블릿 및 패드 대응 (화면 폭 768px 이하) */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr); 
            }
            
            /* 💡 오른쪽 정렬되던 문제를 해결하고 완벽한 하단 중앙 정렬을 적용했습니다. */
            .game-card:last-child:nth-child(odd) {
                grid-column: span 2; 
                max-width: calc(50% - 12.5px); 
                margin: 0 auto; 
                width: 100%;
            }
        }
        
        /* 📱 스마트폰 대응 (화면 폭 480px 이하) */
        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr; 
            }
            .game-card:last-child:nth-child(odd) {
                grid-column: auto;
                max-width: none;
                margin: 0;
            }
        }
    </style>
</head>
<body>
